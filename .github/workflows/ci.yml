name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-test-build:
    name: check / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Type check
        run: moon check

      - name: Unit tests
        run: moon test

      - name: Build CLI (js)
        run: moon build --target js

      - name: Build library (wasm-gc)
        run: moon build --target wasm-gc

      - name: End-to-end interop with official SQLite
        run: |
          CLI=_build/js/debug/build/cmd/moonbase-cli/moonbase-cli.js
          node $CLI make /tmp/mb_out.db
          node $CLI dump-sql /tmp/mb_out.db > /tmp/mb_out.sql
          node $CLI make /tmp/mb_big.db 400
          node $CLI make /tmp/mb_deep.db 20000 512
          python3 scripts/e2e_check.py /tmp/mb_out.db /tmp/mb_out.sql /tmp/mb_big.db /tmp/mb_deep.db
          # structural self-check written in MoonBit itself
          node $CLI check /tmp/mb_deep.db | tee /tmp/mb_check.txt
          grep -q "结构自检通过" /tmp/mb_check.txt
